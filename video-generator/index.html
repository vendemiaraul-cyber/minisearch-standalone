<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Video Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: full-height vertical snap feed in a phone-width column, right action rail, bottom tab bar, slide-up create sheet */
:root{
  --bg:#000;
  --surface:#121214;
  --surface-2:#1e1e22;
  --line:#2c2c32;
  --fg:#f5f5f7;
  --muted:#9a9aa3;
  --pink:#fe2c55;
  --cyan:#25f4ee;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabbar:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}

.app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* top bar */
.top{position:absolute;inset:0 0 auto;z-index:5;display:flex;justify-content:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
  background:linear-gradient(#000a,#0000);pointer-events:none}
.top span{font-weight:800;font-size:17px;letter-spacing:.01em;opacity:.6}
.top span.on{opacity:1;position:relative}
.top span.on::after{content:"";position:absolute;left:50%;bottom:-7px;width:22px;height:3px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}

/* feed */
.feed{height:calc(100% - var(--tabbar) - env(safe-area-inset-bottom,0px));overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--surface)}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.slide .art{position:absolute;inset:0}
.shade{position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(#0000,#000c);pointer-events:none}

.caption{position:absolute;left:16px;right:84px;bottom:20px;z-index:2;display:grid;gap:6px}
.handle{font-weight:800;font-size:16px}
.prompt{font-size:14.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:#ddd}
.meta svg{width:14px;height:14px}
.pill{display:inline-block;padding:3px 9px;border-radius:4px;background:#ffffff26;font-size:12px;font-weight:600}

.rail{position:absolute;right:10px;bottom:28px;z-index:2;display:grid;gap:18px;justify-items:center}
.act{display:grid;justify-items:center;gap:3px;background:none;border:0;padding:0;font-size:12px;font-weight:600;text-shadow:0 1px 2px #000a}
.act .ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.act svg{width:32px;height:32px;filter:drop-shadow(0 1px 2px #0008)}
.act.liked svg{color:var(--pink)}
.avatar{width:46px;height:46px;border-radius:50%;border:2px solid var(--fg);display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--surface-2);margin-bottom:6px}

.tryit{margin-top:6px;justify-self:start;border:0;border-radius:6px;padding:10px 16px;background:var(--pink);font-weight:800}

/* pending */
.pending{display:grid;place-items:center;text-align:center;padding:24px}
.spinner{width:64px;height:64px;position:relative;margin:0 auto 20px}
.spinner i{position:absolute;top:20px;width:24px;height:24px;border-radius:50%;mix-blend-mode:screen;animation:bob 1s ease-in-out infinite alternate}
.spinner i:first-child{left:4px;background:var(--cyan)}
.spinner i:last-child{right:4px;background:var(--pink);animation-delay:-.5s}
@keyframes bob{to{transform:translateX(16px)}}
.spinner i:last-child{animation-name:bob2}
@keyframes bob2{to{transform:translateX(-16px)}}
.pending h2{margin:0 0 6px;font-size:20px}
.pending p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}
.pending.err h2{color:var(--pink)}

/* tab bar */
.tabs{position:absolute;inset:auto 0 0;height:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));
  padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-around;align-items:center;background:var(--bg);border-top:1px solid var(--line);z-index:6}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--fg)}
.tab svg{width:26px;height:26px}
.plus{width:48px;height:32px;border:0;border-radius:9px;position:relative;background:var(--fg);color:#000;display:grid;place-items:center}
.plus::before,.plus::after{content:"";position:absolute;inset:0;border-radius:9px;z-index:-1}
.plus::before{background:var(--cyan);transform:translateX(-4px)}
.plus::after{background:var(--pink);transform:translateX(4px)}
.plus{isolation:isolate}
.plus svg{width:20px;height:20px}

/* sheet */
.scrim{position:absolute;inset:0;background:#0009;z-index:8;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:absolute;inset:auto 0 0;z-index:9;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:14px 14px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .25s ease;display:grid;gap:16px}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h2{margin:0;font-size:18px;text-align:center}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.models{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.models::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:#000}
.mnote{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4}
.mnote a{color:var(--cyan)}
textarea,input[type=password],input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.4}
.row{display:flex;gap:10px}
.go{flex:1;border:0;border-radius:8px;padding:14px;background:var(--pink);font-weight:800;font-size:16px}
.go:disabled{opacity:.5}
.ghost{border:1px solid var(--line);background:none;border-radius:8px;padding:14px 16px;font-weight:600}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin:6px 0 0}
.hint a{color:var(--cyan)}

.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translate(-50%,-10px);z-index:20;background:var(--surface-2);border:1px solid var(--line);
  padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><span class="on">Video Generator</span></div>

  <main class="feed" id="feed" aria-label="Video feed"></main>

  <nav class="tabs" aria-label="Main">
    <button class="tab on" id="tab-home" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg>Home
    </button>
    <button class="plus" id="tab-create" type="button" aria-label="Create video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" id="tab-settings" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Account
    </button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>

  <section class="sheet" id="create" aria-label="Create video" hidden>
    <div class="grab"></div>
    <h2>New video</h2>
    <div>
      <span class="lbl" id="m-lbl">Model</span>
      <div class="models" id="models" role="group" aria-labelledby="m-lbl"></div>
      <p class="mnote" id="mnote"></p>
    </div>
    <div>
      <label class="lbl" for="prompt">Prompt</label>
      <textarea id="prompt" maxlength="1000" placeholder="A red fox running through fresh snow at sunrise, slow motion"></textarea>
    </div>
    <div class="row">
      <button class="ghost" id="cancel" type="button">Cancel</button>
      <button class="go" id="go" type="button">Generate</button>
    </div>
  </section>

  <section class="sheet" id="account" aria-label="Account" hidden>
    <div class="grab"></div>
    <h2>Account</h2>
    <div>
      <label class="lbl" for="token">Hugging Face token</label>
      <input type="password" id="token" autocomplete="off" placeholder="hf_…">
      <p class="hint">Videos are made by Hugging Face Inference Providers and use your account's credits. Get a token at
        <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener">huggingface.co/settings/tokens</a>
        with the "Make calls to Inference Providers" permission. The token is saved only in this browser.</p>
    </div>
    <div class="row">
      <button class="ghost" id="clear" type="button">Delete all my videos</button>
      <button class="go" id="save" type="button">Save</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module">
// Models: open-source video generators from GitHub, served through Hugging Face
const MODELS = [
  { id:"wan5b",   name:"Wan 2.2",       handle:"wan2.2",       model:"Wan-AI/Wan2.2-TI2V-5B",                       provider:"fal-ai", gh:"https://github.com/Wan-Video/Wan2.2",            note:"Alibaba's open model. Good all-rounder." },
  { id:"wan14b",  name:"Wan 2.2 14B",   handle:"wan2.2_14b",   model:"Wan-AI/Wan2.2-T2V-A14B",                      provider:"fal-ai", gh:"https://github.com/Wan-Video/Wan2.2",            note:"Bigger Wan model. Higher quality, slower." },
  { id:"hunyuan", name:"HunyuanVideo",  handle:"hunyuanvideo", model:"tencent/HunyuanVideo",                        provider:"fal-ai", gh:"https://github.com/Tencent-Hunyuan/HunyuanVideo", note:"Tencent's model. Consistent, cinematic motion." },
  { id:"ltx",     name:"LTX-Video",     handle:"ltx_video",    model:"Lightricks/LTX-Video-0.9.8-13B-distilled",    provider:"fal-ai", gh:"https://github.com/Lightricks/LTX-Video",       note:"Lightricks' model. The fastest of the bunch." },
  { id:"mochi",   name:"Mochi 1",       handle:"mochi1",       model:"genmo/mochi-1-preview",                       provider:"fal-ai", gh:"https://github.com/genmoai/mochi",              note:"Genmo's model. Strong prompt following." },
];

const IDEAS = [
  { m:"wan5b",   p:"A red fox running through fresh snow at sunrise, slow motion, low camera angle", c:["#ff7a45","#3a1c71"] },
  { m:"ltx",     p:"Neon-lit Tokyo street in the rain at night, reflections on wet asphalt, handheld camera", c:["#25f4ee","#2b0a3d"] },
  { m:"hunyuan", p:"A cat in a tiny astronaut suit floating inside a space station, soft light", c:["#7f7fd5","#0f2027"] },
  { m:"mochi",   p:"Waves crashing on black volcanic rocks, drone shot pulling back to reveal the coast", c:["#0aa6b5","#06141b"] },
];

const $ = s => document.querySelector(s);
const feed = $("#feed");
let selected = MODELS[0].id;
let videos = [];       // {id, model, prompt, created, liked, blob}
const pending = new Map();

/* ---------- storage (IndexedDB for videos, localStorage for token) ---------- */
const ls = {
  get(k){ try { return localStorage.getItem(k) } catch { return null } },
  set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v) } catch {} },
};
let dbp = null;
function db(){
  if (!dbp) dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open("video-generator", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("videos", { keyPath:"id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e) }
  });
  return dbp;
}
async function store(mode, fn){
  try {
    const d = await db();
    return await new Promise((res, rej) => {
      const tx = d.transaction("videos", mode);
      const out = fn(tx.objectStore("videos"));
      tx.oncomplete = () => res(out && out.result);
      tx.onerror = () => rej(tx.error);
    });
  } catch { return null }
}
const saveVideo = v => store("readwrite", s => s.put(v));
const removeVideo = id => store("readwrite", s => s.delete(id));
const loadVideos = async () => (await store("readonly", s => s.getAll())) || [];

/* ---------- Hugging Face client (loaded on demand) ---------- */
let HFClient = null;
async function getClient(token){
  if (!HFClient) {
    for (const v of ["4.0.0", "3.15.0", "3.13.2"]) {
      try {
        const mod = await import(`https://cdn.jsdelivr.net/npm/@huggingface/inference@${v}/+esm`);
        HFClient = mod.InferenceClient || mod.HfInference;
        if (HFClient) break;
      } catch {}
    }
    if (!HFClient) throw new Error("Couldn't load the Hugging Face library. Check your connection and try again.");
  }
  return new HFClient(token);
}

/* ---------- rendering ---------- */
const ICON = {
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  remix:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h12l-3-3m3 3-3 3M20 17H8l3 3m-3-3 3-3"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18a3 3 0 1 1-2-2.8V5l12-2v11a3 3 0 1 1-2-2.8V6.3L9 7.6z"/></svg>',
};
const modelOf = id => MODELS.find(m => m.id === id) || MODELS[0];
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const ago = t => { const s = (Date.now()-t)/1000; return s<60?"just now":s<3600?`${Math.floor(s/60)}m ago`:s<86400?`${Math.floor(s/3600)}h ago`:`${Math.floor(s/86400)}d ago` };

const urls = new Map();
function urlFor(v){ if (!urls.has(v.id)) urls.set(v.id, URL.createObjectURL(v.blob)); return urls.get(v.id) }

function render(){
  const parts = [];
  for (const [id, p] of pending) {
    const m = modelOf(p.model);
    parts.push(`<section class="slide pending ${p.error?"err":""}" data-id="${id}">
      <div>
        ${p.error ? "" : '<div class="spinner"><i></i><i></i></div>'}
        <h2>${p.error ? "That didn't work" : `Making your video with ${esc(m.name)}`}</h2>
        <p>${p.error ? esc(p.error) : "This usually takes 1 to 5 minutes. You can keep scrolling."}</p>
        ${p.error ? `<div class="row" style="justify-content:center;margin-top:16px"><button class="ghost" data-act="dismiss" data-id="${id}">Dismiss</button><button class="go" style="flex:none;padding:12px 20px" data-act="retry" data-id="${id}">Try again</button></div>` : ""}
      </div>
    </section>`);
  }
  for (const v of videos) {
    const m = modelOf(v.model);
    parts.push(`<section class="slide" data-id="${v.id}">
      <video src="${urlFor(v)}" loop playsinline muted preload="metadata"></video>
      <div class="shade"></div>
      <div class="caption">
        <div class="handle">@${m.handle}</div>
        <div class="prompt">${esc(v.prompt)}</div>
        <div class="meta">${ICON.note}<span>${esc(m.name)} · ${ago(v.created)}</span></div>
      </div>
      <div class="rail">
        <div class="avatar" aria-hidden="true">${m.name[0]}</div>
        <button class="act ${v.liked?"liked":""}" data-act="like" data-id="${v.id}" aria-pressed="${!!v.liked}"><span class="ic">${ICON.heart}</span>${v.liked?"Liked":"Like"}</button>
        <button class="act" data-act="remix" data-id="${v.id}"><span class="ic">${ICON.remix}</span>Remix</button>
        <a class="act" href="${urlFor(v)}" download="video-${v.id}.mp4" style="color:inherit;text-decoration:none"><span class="ic">${ICON.save}</span>Save</a>
        <button class="act" data-act="delete" data-id="${v.id}"><span class="ic">${ICON.trash}</span>Delete</button>
      </div>
    </section>`);
  }
  IDEAS.forEach((idea, i) => {
    const m = modelOf(idea.m);
    parts.push(`<section class="slide">
      <div class="art" style="background:radial-gradient(120% 80% at 30% 20%, ${idea.c[0]}88, transparent 60%), linear-gradient(160deg, ${idea.c[1]}, #000)"></div>
      <div class="shade"></div>
      <div class="caption">
        <span class="pill">Idea to try</span>
        <div class="handle">@${m.handle}</div>
        <div class="prompt">${esc(idea.p)}</div>
        <button class="tryit" data-act="idea" data-i="${i}">Make this video</button>
      </div>
      <div class="rail">
        <div class="avatar" aria-hidden="true">${m.name[0]}</div>
        <button class="act" data-act="copyidea" data-i="${i}"><span class="ic">${ICON.copy}</span>Copy</button>
      </div>
    </section>`);
  });
  feed.innerHTML = parts.join("");
  watchPlayback();
}

let io;
function watchPlayback(){
  io?.disconnect();
  io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const vid = e.target.querySelector("video");
      if (!vid) continue;
      if (e.isIntersecting) { vid.play().catch(()=>{}) } else { vid.pause() }
    }
  }, { root: feed, threshold: .6 });
  feed.querySelectorAll(".slide").forEach(s => io.observe(s));
}

// tap a video to toggle sound
feed.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (btn) return onAction(btn);
  const vid = e.target.closest(".slide")?.querySelector("video");
  if (vid && !e.target.closest("a")) { vid.muted = !vid.muted; toast(vid.muted ? "Sound off" : "Sound on") }
});

async function onAction(btn){
  const id = btn.dataset.id, act = btn.dataset.act;
  const v = videos.find(x => x.id === id);
  if (act === "like" && v) { v.liked = !v.liked; await saveVideo(v); render(); scrollToId(id) }
  if (act === "remix" && v) { openCreate(v.prompt, v.model) }
  if (act === "delete" && v) {
    if (btn.dataset.sure) {
      videos = videos.filter(x => x.id !== id); await removeVideo(id);
      URL.revokeObjectURL(urls.get(id)); urls.delete(id); render(); toast("Deleted");
    } else { btn.dataset.sure = "1"; btn.lastChild.textContent = "Sure?"; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.sure; btn.lastChild.textContent = "Delete" } }, 3000) }
  }
  if (act === "idea") { const i = IDEAS[+btn.dataset.i]; openCreate(i.p, i.m) }
  if (act === "copyidea") { copy(IDEAS[+btn.dataset.i].p) }
  if (act === "dismiss") { pending.delete(id); render() }
  if (act === "retry") { const p = pending.get(id); pending.delete(id); generate(p.model, p.prompt) }
}

function scrollToId(id){ const el = feed.querySelector(`[data-id="${id}"]`); if (el) feed.scrollTop = el.offsetTop }

async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("Prompt copied") } catch { toast("Couldn't copy") }
}

let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800) }

/* ---------- sheets ---------- */
let openSheet = null;
function show(sheet){
  close();
  openSheet = sheet; $("#scrim").hidden = false; sheet.hidden = false;
  requestAnimationFrame(() => { $("#scrim").classList.add("open"); sheet.classList.add("open") });
}
function close(){
  if (!openSheet) return;
  const s = openSheet; openSheet = null;
  s.classList.remove("open"); $("#scrim").classList.remove("open");
  setTimeout(() => { s.hidden = true; if (!openSheet) $("#scrim").hidden = true }, 250);
}
$("#scrim").addEventListener("click", close);
$("#cancel").addEventListener("click", close);
document.addEventListener("keydown", e => { if (e.key === "Escape") close() });

function renderModels(){
  $("#models").innerHTML = MODELS.map(m => `<button class="chip" type="button" data-m="${m.id}" aria-pressed="${m.id===selected}">${m.name}</button>`).join("");
  const m = modelOf(selected);
  $("#mnote").innerHTML = `${m.note} <a href="${m.gh}" target="_blank" rel="noopener">GitHub</a>`;
}
$("#models").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { selected = b.dataset.m; renderModels() } });

function openCreate(prompt = "", model){
  if (model) selected = model;
  renderModels();
  $("#prompt").value = prompt || ls.get("draft") || "";
  show($("#create"));
  setTimeout(() => $("#prompt").focus(), 260);
}
$("#prompt").addEventListener("input", e => ls.set("draft", e.target.value));

$("#tab-create").addEventListener("click", () => openCreate());
$("#tab-home").addEventListener("click", () => { close(); feed.scrollTo({ top:0, behavior:"smooth" }) });
$("#tab-settings").addEventListener("click", () => { $("#token").value = ls.get("hf_token") || ""; show($("#account")) });
$("#save").addEventListener("click", () => { ls.set("hf_token", $("#token").value.trim() || null); close(); toast("Saved") });
$("#clear").addEventListener("click", async e => {
  const b = e.currentTarget;
  if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tap again to delete all"; return }
  delete b.dataset.sure; b.textContent = "Delete all my videos";
  for (const v of videos) await removeVideo(v.id);
  videos = []; render(); close(); toast("All videos deleted");
});

$("#go").addEventListener("click", () => {
  const prompt = $("#prompt").value.trim();
  if (!prompt) { toast("Write a prompt first"); $("#prompt").focus(); return }
  if (!ls.get("hf_token")) { toast("Add your Hugging Face token first"); $("#token").value = ""; show($("#account")); return }
  ls.set("draft", null);
  close();
  generate(selected, prompt);
});

/* ---------- generation ---------- */
async function generate(modelId, prompt){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  pending.set(id, { model:modelId, prompt });
  render(); feed.scrollTo({ top:0, behavior:"smooth" });
  const m = modelOf(modelId);
  try {
    const client = await getClient(ls.get("hf_token"));
    const blob = await client.textToVideo({ provider:m.provider, model:m.model, inputs:prompt });
    const v = { id, model:modelId, prompt, created:Date.now(), liked:false, blob };
    pending.delete(id);
    videos.unshift(v);
    await saveVideo(v);
    render(); feed.scrollTo({ top:0, behavior:"smooth" });
    toast("Your video is ready");
  } catch (err) {
    let msg = (err && err.message) || "Something went wrong.";
    if (/401|unauthor|invalid.*token/i.test(msg)) msg = "Your Hugging Face token was rejected. Check it in Account.";
    else if (/402|credit|payment|quota/i.test(msg)) msg = "Your Hugging Face credits ran out. Add credits or try again next month.";
    pending.set(id, { model:modelId, prompt, error:msg });
    render();
  }
}

/* ---------- start ---------- */
(async () => {
  videos = (await loadVideos()).sort((a, b) => b.created - a.created);
  render();
})();
</script>
